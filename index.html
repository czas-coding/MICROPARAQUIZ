<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finals Jumbled Interactive Quiz</title>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --success: #10B981;
            --danger: #EF4444;
            --bg: #F3F4F6;
            --card-bg: #FFFFFF;
            --text-main: #111827;
            --text-muted: #6B7280;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .quiz-container {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 600px;
            padding: 30px;
            overflow: hidden;
            position: relative;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--bg);
            padding-bottom: 15px;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0 0 10px 0;
            color: var(--primary);
        }

        .progress-text {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: 500;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background: var(--bg);
            border: 2px solid transparent;
            padding: 15px 20px;
            border-radius: 8px;
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-main);
        }

        .option-btn:hover:not(:disabled) {
            background: #E5E7EB;
            border-color: #D1D5DB;
        }

        .option-btn.correct {
            background: #D1FAE5;
            border-color: var(--success);
            color: #065F46;
        }

        .option-btn.wrong {
            background: #FEE2E2;
            border-color: var(--danger);
            color: #991B1B;
        }

        .option-btn:disabled {
            cursor: not-allowed;
        }

        .controls {
            margin-top: 25px;
            display: flex;
            justify-content: flex-end;
        }

        .primary-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            display: none;
        }

        .primary-btn:hover {
            background: var(--primary-hover);
        }

        .feedback {
            margin-top: 15px;
            font-weight: 500;
            text-align: center;
            min-height: 24px;
        }

        /* Result Screen */
        .result-screen {
            display: none;
            text-align: center;
        }

        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: var(--bg);
            border: 8px solid var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            margin: 0 auto 20px auto;
            color: var(--primary);
        }
        
        .result-message {
            font-size: 1.2rem;
            margin-bottom: 30px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="quiz-container">
        <!-- Quiz Screen -->
        <div id="quiz-screen">
            <div class="header">
                <h1>Microbiology Finals Prep</h1>
                <div class="progress-text" id="progress-text">Question 1 of X</div>
            </div>
            
            <div class="question-text" id="question-text">Loading question...</div>
            
            <div class="options-container" id="options-container">
                <!-- Options will be injected here -->
            </div>

            <div class="feedback" id="feedback-text"></div>

            <div class="controls">
                <button class="primary-btn" id="next-btn" onclick="nextQuestion()">Next Question</button>
            </div>
        </div>

        <!-- Result Screen -->
        <div class="result-screen" id="result-screen">
            <h1>Quiz Completed!</h1>
            <div class="score-circle" id="score-display">0/0</div>
            <div class="result-message" id="result-message">Great job reviewing your materials!</div>
            <button class="primary-btn" style="display: inline-block;" onclick="startQuiz()">Restart Jumbled Quiz</button>
        </div>
    </div>

                options: ["Fever, fatigue, muscle pain, and headache", "Profuse bleeding and coma", "Severe respiratory distress and productive cough", "Jaundice and right upper quadrant pain"],

        let currentQuiz = [];
        let currentQuestionIndex = 0;
        let score = 0;

        // Utility function to shuffle an array
        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        function startQuiz() {
            // Jumble questions and options
            currentQuiz = shuffleArray(sourceQuestions).map(q => {
                return {
                    question: q.question,
                    options: shuffleArray(q.options),
                    answer: q.answer
                };
            });
            
            currentQuestionIndex = 0;
            score = 0;
            
            document.getElementById('result-screen').style.display = 'none';
            document.getElementById('quiz-screen').style.display = 'block';
            
            loadQuestion();
        }

        function loadQuestion() {
            const q = currentQuiz[currentQuestionIndex];
            
            // Update UI
            document.getElementById('progress-text').innerText = `Question ${currentQuestionIndex + 1} of ${currentQuiz.length}`;
            document.getElementById('question-text').innerText = q.question;
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            // Create option buttons
            q.options.forEach(optionText => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = optionText;
                btn.onclick = () => selectAnswer(btn, optionText, q.answer);
                optionsContainer.appendChild(btn);
            });
            
            // Reset feedback and button
            document.getElementById('feedback-text').innerText = '';
            document.getElementById('feedback-text').style.color = 'inherit';
            document.getElementById('next-btn').style.display = 'none';
        }

        function selectAnswer(selectedBtn, selectedText, correctText) {
            // Disable all buttons after selection
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(btn => btn.disabled = true);
            
            const feedbackText = document.getElementById('feedback-text');
            
            if (selectedText === correctText) {
                selectedBtn.classList.add('correct');
                feedbackText.innerText = 'Correct! Well done.';
                feedbackText.style.color = 'var(--success)';
                score++;
            } else {
                selectedBtn.classList.add('wrong');
                feedbackText.innerText = 'Incorrect.';
                feedbackText.style.color = 'var(--danger)';
                
                // Highlight correct answer
                allBtns.forEach(btn => {
                    if (btn.innerText === correctText) {
                        btn.classList.add('correct');
                    }
                });
            }
            
            document.getElementById('next-btn').style.display = 'inline-block';
            
            // Change button text if it's the last question
            if (currentQuestionIndex === currentQuiz.length - 1) {
                document.getElementById('next-btn').innerText = 'Finish Quiz';
            } else {
                document.getElementById('next-btn').innerText = 'Next Question';
            }
        }

        function nextQuestion() {
            currentQuestionIndex++;
            
            if (currentQuestionIndex < currentQuiz.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('quiz-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'block';
            
            document.getElementById('score-display').innerText = `${score}/${currentQuiz.length}`;
            
            const percentage = (score / currentQuiz.length) * 100;
            let msg = '';
            if (percentage >= 90) msg = "Outstanding! You are ready for your finals.";
            else if (percentage >= 70) msg = "Good job! A little more review and you'll be perfect.";
            else msg = "Keep studying! Review your materials and try again.";
            
            document.getElementById('result-message').innerText = msg;
        }

        // Initialize quiz on load
        window.onload = startQuiz;
    </script>
